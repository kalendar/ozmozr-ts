services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ozmozr_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: ozmozr_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
volumes:
  pgdata:
