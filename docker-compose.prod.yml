# Production stack: Postgres, a one-shot migration, the web app and the worker.
# Set BETTER_AUTH_SECRET, BETTER_AUTH_URL and POSTGRES_PASSWORD in the environment
# (or an .env file next to this one) before `docker compose -f docker-compose.prod.yml up -d`.
x-app: &app
  build: .
  environment: &app-env
    DATABASE_URL: postgres://ozmozr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/ozmozr
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL, e.g. https://ozmozr.example}
    UPLOAD_DIR: /data/uploads
  volumes: ["uploads:/data/uploads"]
  restart: unless-stopped

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ozmozr
      POSTGRES_DB: ozmozr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozmozr"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    <<: *app
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["npm", "run", "worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  uploads:
